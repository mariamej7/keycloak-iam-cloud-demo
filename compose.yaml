# Projet Docker complètement indépendant des autres services de l'utilisateur.
# Mode de DÉMONSTRATION LOCALE uniquement (pas de configuration de production).
name: keycloak-demo-universite-2026
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
    volumes:
      - kc_demo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 4s
      retries: 20
    networks: [kc_demo_network]

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8080
      KC_HTTP_ENABLED: "true"
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./realm/universite-realm.json:/opt/keycloak/data/import/universite-realm.json:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [kc_demo_network]

volumes:
  kc_demo_pg_data:

networks:
  kc_demo_network:
    driver: bridge
